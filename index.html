<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Calculadora</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <section class="container">
        <h1>Calculadora Soma</h1>
        <input type="number" id="numero1" placeholder="Digite o primeiro numero">
        <input type="number" id="numero2" placeholder="Digite o segundo numero">

        <button onclick="somar()">calculadora soma</button>

        <h2 id="resultado1">resultado:</h2>
    </section>

    <section class="container">
        <h1>Converter Celsius para Fahreheit</h1>

        <input type="number" id="celsius" placeholder="Digite a temperatura">

        <button onclick="converter()">converter</button>

        <h2 id="resultado2">resultado</h2>
    </section>

    <section class="container">

        <h1>Calcule e apresente o valor de volume de uma lata</h1>

        <input type="number" id="altura" placeholder="Digite a altura">
        <input type="number" id="raio" placeholder="Digite a altura">

        <button onclick="calcular()">converter</button>

        <h2 id="resultado3">calcular</h2>

    </section>

    <section class="container">

        <h1>Calcule e apresente o valor de volume de uma lata</h1>

        <input type="number" id="comprimento" placeholder="Digite a altura">
        <input type="number" id="largura" placeholder="Digite a altura">
        <input type="number" id="altura2" placeholder="Digite a altura">

        <button onclick="calcular()">converter</button>

        <h2 id="resultado4">calcular</h2>

    </section>
    
    
    <script src="JavaScript/script.js"></script>
</body>
</html>
